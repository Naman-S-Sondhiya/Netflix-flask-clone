apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-app
  namespace: {{ .Values.namespace}}
spec:
  selector:
    matchLabels:
      app: netflix-app
  replicas: 2
  template:
    metadata:
      labels:
        app: netflix-app
    spec:
      containers:
      - name: netflix-app
        image: {{ .Values.container}}
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: netflix-app
  namespace: {{ .Values.namespace }}
  labels:
    app: netflix-app
spec:
  selector:
    app: netflix-app
  type: NodePort
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30007
    protocol: TCP
