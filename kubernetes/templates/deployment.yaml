apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-app
  namespace: {{ .Values.namespace}}
spec:
  selector:
    matchLabels:
      app: netflix-app
  replicas: 2
  template:
    metadata:
      labels:
        app: netflix-app
    spec:
      containers:
      - name: netflix-app
        image: {{ .Values.container}}
        ports:
        - containerPort: 5000
